[workspace]
resolver = "3"
members = [
    "crates/matrix-frame",
    "crates/matrix-device",
    "crates/matrix-media",
    "crates/matrix-playout",
    "crates/matrix-text",
    "crates/matrix-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/bennight/mcp-matrix-rs"

[workspace.dependencies]
thiserror = "2"
