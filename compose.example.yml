services:
  matrix:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp-matrix-rs:local
    env_file:
      - ${MATRIX_ENV_FILE:-.env}
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
